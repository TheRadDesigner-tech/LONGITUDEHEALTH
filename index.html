<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#0F181D',
              surface: '#16252C',
              surfaceHighlight: '#1F3139',
              primary: '#E3E438',    // Yellow
              secondary: '#4558A7',  // Purple
              accent: '#53AACC',     // Light Blue
              light: '#FFFFFF',      // Pure white for maximum brightness
              border: '#2A3F48'
            },
            fontFamily: {
              sans: ['Open Sans', 'sans-serif'],
              display: ['tt-travels-next', 'sans-serif'], 
              outline: ['tt-travels-next-outline', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            animation: {
              'marquee': 'marquee 30s linear infinite',
              'spin-slow': 'spin 180s linear infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Global UI Scale Up for Laptops */
      html {
        font-size: 110%;
      }

      body {
        background-color: #0F181D;
        /* Procedural Recreation of the Cross Pattern using SVG Data URI */
        /* Color matches the secondary brand blue #4558A7 with enough opacity to be seen clearly */
        background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%234558A7' fill-opacity='0.25'%3E%3Crect x='39' y='34' width='2' height='12'/%3E%3Crect x='34' y='39' width='12' height='2'/%3E%3C/g%3E%3C/svg%3E");
        background-size: 80px 80px;
        background-attachment: fixed;
        color: #FFFFFF;
        font-family: 'Open Sans', sans-serif;
        font-weight: 700;
        -webkit-font-smoothing: antialiased;
        line-height: 1.6;
      }

      /* Ensure the background pattern persists on the main app container */
      #root > div, .bg-background {
        background-color: transparent !important;
        background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%234558A7' fill-opacity='0.25'%3E%3Crect x='39' y='34' width='2' height='12'/%3E%3Crect x='34' y='39' width='12' height='2'/%3E%3C/g%3E%3C/svg%3E") !important;
        background-size: 80px 80px !important;
        background-attachment: fixed !important;
      }
      
      h1, h2, h3, h4, h5, h6 {
        font-family: 'tt-travels-next', sans-serif;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-transform: uppercase;
      }

      /* Heading scales adjusted for 110% base */
      .text-4xl { font-size: 2.25rem !important; }
      .text-5xl { font-size: 3rem !important; }
      .text-6xl { font-size: 4rem !important; }
      .text-7xl { font-size: 5rem !important; }
      .text-8xl { font-size: 6rem !important; }
      .text-9xl { font-size: 7.5rem !important; }

      .text-slate-400 { color: #CBD5E1 !important; }
      .text-slate-300 { color: #E2E8F0 !important; }
      .text-slate-500 { color: #94A3B8 !important; }

      .glass {
        background: rgba(22, 37, 44, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
